name: Deploy GitHub Pages

# index.html이 바뀌어 푸시될 때마다 gh-pages 브랜치에 복사해서
# https://ysh030812-collab.github.io/Lecture-organizer/ 를 갱신한다.
on:
  push:
    branches:
      - claude/device-storage-m1ucmd
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish index.html to gh-pages
        run: |
          mkdir site
          cp index.html site/
          touch site/.nojekyll
          cd site
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
